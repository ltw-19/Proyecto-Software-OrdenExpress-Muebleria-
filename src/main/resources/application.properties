spring.application.name=orden-express-muebleria
server.port=8080

# ---------- Persistencia (archivos JSON) ----------
# Carpeta donde se guardan los .json (se crea sola; está en el .gitignore)
app.datos.directorio=datos

# ---------- Regla de negocio bimonetaria ----------
# Tasa oficial BCV (Bs. por cada 1 USD). VALOR DE EJEMPLO: actualizar con la tasa vigente.
tasa.bcv=40.00

# ---------- Seguridad (JWT) ----------
# Mínimo 32 caracteres. El valor por defecto es SOLO para desarrollo:
# para la entrega define la variable de entorno JWT_SECRETO con otra clave.
app.jwt.secreto=${JWT_SECRETO:clave-de-desarrollo-cambiar-antes-de-entregar-2026}
app.jwt.horas-expiracion=8

# Origen permitido del frontend Vue (servidor de desarrollo de Vite)
app.cors.origen=http://localhost:5173

# ---------- WhatsApp del Gestor de Ventas (un solo número fijo) ----------
# Formato internacional sin "+" ni espacios. VALOR DE EJEMPLO: reemplazar por el real.
app.whatsapp.numero=584120000000

# ---------- Usuarios iniciales (requisito técnico de inicialización) ----------
# Solo se crean si usuarios.json está vacío. Cambiar estas claves antes de la entrega.
app.semilla.admin.nombre=Administrador
app.semilla.admin.apellido=OrdenExpress
app.semilla.admin.correo=admin@ordenexpress.com
app.semilla.admin.clave=Admin2026*
app.semilla.gestor.nombre=Gestor
app.semilla.gestor.apellido=de Ventas
app.semilla.gestor.correo=gestor@ordenexpress.com
app.semilla.gestor.clave=Gestor2026*
